name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Syntax check ─────────────────────────────────────────────────────────────
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile spotrr.py
        run: |
          python -m py_compile spotrr.py
          python -m py_compile setup.sh 2>/dev/null || true
          echo "✅ Syntax OK"

  # ── Test suite ────────────────────────────────────────────────────────────────
  test:
    name: Tests — Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pillow requests qrcode[pil]

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # ── Requirements sanity ───────────────────────────────────────────────────────
  requirements:
    name: requirements.txt sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify requirements.txt is parseable
        run: |
          python -c "
          with open('requirements.txt') as f:
              lines = [l.strip() for l in f if l.strip() and not l.startswith('#')]
          print('Packages listed:', len(lines))
          for line in lines:
              print(' ', line)
          assert len(lines) >= 5, 'requirements.txt looks too short'
          print('OK')
          "
